name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Preview lives at https://gonkowonko.github.io/gonkowonko-site/ and is hidden from search engines.
          # For the real launch on gonkowonko.com, remove these three lines and add public/CNAME.
          SITE: https://gonkowonko.github.io
          BASE: /gonkowonko-site
          PUBLIC_NOINDEX: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
